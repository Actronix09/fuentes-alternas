# =====================================================================
#  Sistema 2 · Consumo de agua en la CDMX validado con reportes ciudadanos
#
#  Levantar todo (la primera vez descarga ~95 MB del portal de la CDMX):
#      docker compose up -d --build
#      docker compose logs -f etl        # avance del pipeline
#  Página:        http://localhost:8092
#  PostgreSQL:    localhost:5442  (usuario/contraseña en .env.example)
#
#  Recargar desde el portal:        FORZAR_ETL=1 FORZAR_DESCARGA=1 docker compose up etl
#  Borrar todo (incluida la base):  docker compose down -v
# =====================================================================
name: fa-agua

x-app: &app
  build: ./app
  image: fa-agua-app
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-agua}:${POSTGRES_PASSWORD:-agua_local}@db:5432/${POSTGRES_DB:-agua_dw}
    DIR_DATOS: /datos
    TZ: America/Mexico_City
    DISTANCIA_MAX_M: ${DISTANCIA_MAX_M:-1000}
    FORZAR_ETL: ${FORZAR_ETL:-0}
    FORZAR_DESCARGA: ${FORZAR_DESCARGA:-0}

services:
  db:
    image: postgres:16.4-alpine
    container_name: fa-agua-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agua_dw}
      POSTGRES_USER: ${POSTGRES_USER:-agua}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agua_local}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: America/Mexico_City
    ports:
      - "${DB_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
      - ./sql:/consultas:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30

  etl:
    <<: *app
    container_name: fa-agua-etl
    command: ["python", "etl.py"]
    volumes:
      - ./datos:/datos
      - ./original:/original:ro
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    container_name: fa-agua-web
    restart: unless-stopped
    volumes:
      - ./original:/original:ro
      - ./datos:/datos:ro
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "2", "--timeout", "120", "web:app"]
    ports:
      - "${WEB_PORT:-8092}:8000"
    depends_on:
      etl:
        condition: service_completed_successfully

volumes:
  pgdata:
    name: fa-agua-pgdata
